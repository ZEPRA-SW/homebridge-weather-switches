name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / Homebridge ${{ matrix.homebridge }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        homebridge: ['1', '2']
    env:
      WEATHER_HOMEBRIDGE_VERSION: ${{ matrix.homebridge }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check syntax, schema and examples
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Inspect production package
        run: npm pack --dry-run --ignore-scripts
